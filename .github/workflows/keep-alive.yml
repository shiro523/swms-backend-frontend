# Keeps the Render free-tier backend awake. Render spins a free web service
# down after ~15 minutes without traffic, and the next visitor then waits
# 30-60s for it to boot. Pinging every 10 minutes prevents that.
#
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions ->
# Variables -> New repository variable:
#   RENDER_HEALTH_URL = https://<your-render-service>.onrender.com/api/health
# Until it's set, this workflow does nothing.
#
# /api/health doesn't touch the database, so this keeps only Render awake,
# not Neon — Neon's free compute hours aren't spent on pings.
#
# Notes: one always-on service uses ~744 of Render's 750 free instance hours
# per month. GitHub may delay scheduled runs at busy times, and disables
# them after 60 days with no repository activity.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_HEALTH_URL != '' }}
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 2 "${{ vars.RENDER_HEALTH_URL }}"
